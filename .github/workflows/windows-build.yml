# A Windows release build from a clean machine and clean sources.
#
# - Started by hand: builds and checks, and keeps the files as an artifact. Not a release.
# - A pushed tag `v*`: the same with stricter checks, then a draft of the release with the files attached.
#   Nothing is public until the draft is published by hand.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      # An exact version, installed by the rustup of the runner image.
      RUSTUP_TOOLCHAIN: 1.92.0
      TARGET: x86_64-pc-windows-msvc
      EXE: target/x86_64-pc-windows-msvc/release/branchpod.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history: a tag must be a commit of `main`.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        if: github.event_name == 'push'
        run: |
          $version = (cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages[0].version
          if (-not $version) {
            '::error::The version cannot be read from Cargo.toml.'
            exit 1
          }
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            "::error::The tag is $env:GITHUB_REF_NAME, but Cargo.toml says $version."
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            "::error::The commit of the tag $env:GITHUB_REF_NAME is not in main."
            exit 1
          }

      # No cache: everything is compiled from the locked sources.
      - name: Build
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          # With a separator that cannot be part of a path. The flags are not applied to build scripts and
          # procedural macros, because of `--target`.
          $env:CARGO_ENCODED_RUSTFLAGS = @(
            # Without it the binary needs VCRUNTIME140.dll, which a clean Windows does not have.
            '-Ctarget-feature=+crt-static'
            # Panic messages name source files.
            "--remap-path-prefix=$cargoHome=cargo"
            "--remap-path-prefix=$env:GITHUB_WORKSPACE=branchpod"
          ) -join [char]0x1f
          rustc -vV
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo build --release --locked --target $env:TARGET
          exit $LASTEXITCODE

      - name: Check that no C runtime has to be installed
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' |
            Select-Object -Last 1
          if (-not $dumpbin) {
            '::error::dumpbin.exe was not found on the runner.'
            exit 1
          }
          $output = & $dumpbin /nologo /dependents $env:EXE
          $dlls = @($output | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^\S+\.dll$' })
          $dlls
          # Every program imports it: without it the output was not understood.
          if ($dlls -notcontains 'kernel32.dll') {
            '::error::The imported libraries could not be read.'
            exit 1
          }
          $runtime = @($dlls -match '^(vcruntime|msvcp|msvcr|concrt|ucrtbase|api-ms-win-crt)')
          if ($runtime) {
            "::error::The binary needs the C runtime: $($runtime -join ', ')."
            exit 1
          }

      - name: Check that no paths of the build machine are in the binary
        run: |
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $env:EXE).Path)
          # UTF-16 text can start at an even or an odd offset.
          $texts = @(
            [Text.Encoding]::Latin1.GetString($bytes)
            [Text.Encoding]::Unicode.GetString($bytes)
            [Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 1)
          )
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          $patterns = @('[a-z]:[\\/]+Users[\\/]', [regex]::Escape($env:USERNAME))
          foreach ($path in $cargoHome, $env:USERPROFILE, $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP) {
            $patterns += ($path -split '[\\/]+' | ForEach-Object { [regex]::Escape($_) }) -join '[\\/]+'
          }
          $found = foreach ($text in $texts) {
            foreach ($pattern in $patterns) {
              # With what follows, to see where it comes from.
              [regex]::Matches($text, "(?i)$pattern[ -~]{0,80}") | ForEach-Object Value
            }
          }
          if ($found) {
            $found | Sort-Object -Unique | Select-Object -First 20
            "::error::The binary contains paths of the build machine or its user name ($(@($found).Count) matches)."
            exit 1
          }

      - name: Check the version
        run: |
          $version = (cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages[0].version
          $head = git rev-parse HEAD
          $output = & $env:EXE --version
          if ($LASTEXITCODE -ne 0) {
            "::error::branchpod --version failed with exit code $LASTEXITCODE."
            exit 1
          }
          $output
          if ("$output" -cnotmatch '^bp (?<version>\S+)(?: \((?<commit>[^()]+)\))?$') {
            "::error::Unexpected output of branchpod --version: $output"
            exit 1
          }
          $commit = $Matches.commit
          if ($Matches.version -cne $version) {
            "::error::The binary says version $($Matches.version), Cargo.toml says $version."
            exit 1
          }
          # A mark for uncommitted changes (`-dirty`) is rejected here as well.
          if ($commit -and ($commit -cnotmatch '^[0-9a-f]{7,40}$' -or -not $head.StartsWith($commit))) {
            "::error::The binary says commit $commit, but it was built from $head."
            exit 1
          }
          if (-not $commit -and $env:GITHUB_EVENT_NAME -eq 'push') {
            '::error::The binary does not say which commit it was built from.'
            exit 1
          }

      - name: Name and hash
        run: |
          $label = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { git rev-parse --short=9 HEAD }
          $name = "branchpod-$label-$env:TARGET.exe"
          $dist = New-Item -ItemType Directory "$env:RUNNER_TEMP/dist"
          Copy-Item $env:EXE "$dist/$name"
          $sha256 = (Get-FileHash "$dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          # The format of sha256sum.
          [IO.File]::WriteAllText("$dist/$name.sha256", "$sha256  $name`n")
          $summary = @(
            $name
            "commit $(git rev-parse HEAD)"
            "size   $((Get-Item "$dist/$name").Length)"
            "SHA256 $sha256"
            # Antivirus vendors ask for it.
            "MD5    $((Get-FileHash "$dist/$name" -Algorithm MD5).Hash.ToLowerInvariant())"
          )
          $summary
          @('```') + $summary + @('```') | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: branchpod-windows
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  # The only job that can write. It runs no code of the project: there is no checkout, and the binary is
  # only passed on.
  draft-release:
    name: draft-release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: dist
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: branchpod-windows
          path: dist

      - name: Check the hash
        run: |
          if ! sha256sum --check --strict -- *.sha256; then
            echo "::error::The files are not the ones that were built."
            exit 1
          fi

      # Drafts included: neither a draft nor a published release is ever overwritten.
      - name: Check that there is no such release yet
        run: |
          tags=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if grep -Fxq -- "$TAG" <<< "$tags"; then
            echo "::error::There already is a release or a draft for $TAG. Delete the draft to have it made again."
            exit 1
          fi

      - name: Create the draft
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "" -- *.exe *.sha256
