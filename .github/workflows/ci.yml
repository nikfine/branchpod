name: CI

on:
  pull_request:
    # The defaults plus `ready_for_review`, which starts the full matrix for a draft marked ready.
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

# A newer push to the same pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # A draft pull request (under review) runs Linux only; the full matrix runs once it is
        # marked ready for review, and on a manual run. A draft cannot be merged, so the required
        # macOS and Windows checks are only needed by then.
        os: >-
          ${{ fromJSON(github.event.pull_request.draft
          && '["ubuntu-latest"]'
          || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The job name is a required status check: keep it free of the version number.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
