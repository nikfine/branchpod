[package]
name = "branchpod"
version = "0.1.0"
edition = "2024"
# 1.89: std::fs::File::lock
rust-version = "1.89"
description = "A resource runtime for git worktrees: spin up everything a branch needs, track it, and clean it up completely."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nikfine/branchpod"
readme = "README.md"
keywords = ["git", "worktree", "devtools", "cli"]
categories = ["command-line-utilities", "development-tools"]

# `bp` is the short name used in docs; it is installed as an optional alias because
# `bp` is taken on crates.io (see docs/design/initial-decisions.md, "Name").
[[bin]]
name = "branchpod"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
directories = "6.0.0"
dunce = "1.0.5"
reflink-copy = "0.1.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
# Directory links without admin rights or developer mode.
junction = { version = "2.1.0", default-features = false }
# Restart Manager: names the processes holding a file that teardown cannot remove. Named pipes
# and process queries: the supervisor's control channel and pid + start time checks.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# Process groups, signals and process start times for the supervisor (already in the tree).
libc = "0.2.191"
